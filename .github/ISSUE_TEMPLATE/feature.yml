name: Feature request
description: Suggest an improvement to the Factory
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Engine (lanes, stages, handoffs)
        - Inbox and founder gate
        - Standing agents
        - Process skills
        - Onboarding
        - Packs
        - Other
