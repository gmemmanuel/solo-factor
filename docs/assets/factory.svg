<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 352" role="img" aria-labelledby="t d">
<title id="t">The factory at work</title>
<desc id="d">Tickets ride a conveyor belt through five stations: plan review, build, code review, you try it, and ship. Each station stamps the ticket as it passes, and it leaves merged.</desc>
<style>
  .bg{fill:#0d1117}.grid{stroke:#161b22;stroke-width:1}
  .label{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em;fill:#8b949e;text-anchor:middle}
  .small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#6e7681}
  .title{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.3em;fill:#e6edf3}
  .body{fill:#161b22;stroke:#30363d;stroke-width:1.5}
  .arm{fill:#30363d}
  .belt{fill:#21262d;stroke:#30363d;stroke-width:1.5}
  .tread{fill:none;stroke:#484f58;stroke-width:3;stroke-dasharray:10 14;animation:tread 1s linear infinite}
  .wheel{fill:#161b22;stroke:#484f58;stroke-width:2}
  .gear{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
  .gear.r{animation-direction:reverse;animation-duration:4s}
  .press{animation:press 4s cubic-bezier(.3,0,.2,1) infinite}
  .lamp{animation:lamp 4s linear infinite}
  .card{animation:ride 12s linear infinite}
  .face{animation:tint 12s linear infinite}
  .tick{fill:none;stroke:#0d1117;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;animation:tick 12s linear infinite}
  .ctext{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117}
  .puff{fill:#30363d;animation:puff 3.2s ease-out infinite}
  .merged{animation:merged 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes tread{to{stroke-dashoffset:-24}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes press{0%,100%{transform:translateY(0)}4%{transform:translateY(22px)}9%{transform:translateY(22px)}18%{transform:translateY(0)}}
  @keyframes lamp{0%{opacity:1}12%{opacity:1}30%,100%{opacity:.18}}
  @keyframes ride{from{transform:translateX(-90px)}to{transform:translateX(980px)}}
  @keyframes tint{0%,20%{fill:#8b949e}22%,35%{fill:#58a6ff}37%,50%{fill:#f0b429}52%,65%{fill:#bc8cff}67%,80%{fill:#ff8f6b}82%,100%{fill:#3fb950}}
  @keyframes tick{0%,81%{opacity:0}83%,100%{opacity:1}}
  @keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:.9}100%{opacity:0;transform:translate(12px,-32px) scale(1.6)}}
  @keyframes merged{0%{transform:scale(.6);opacity:.3}10%{transform:scale(1.25);opacity:1}30%,100%{transform:scale(1);opacity:.55}}
  @media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important}}
</style>
